<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Entomatical compile webview harness</title>
<link rel="stylesheet" href="../media/board.css"><link rel="stylesheet" href="../media/plan-setup.css"></head>
<body>
<script>
  // Stand-in for the VS Code webview API: the real media/board.js runs unchanged on top of it.
  // Posted messages land in window.__posted; persisted state survives a reload through sessionStorage so an interrupted compile can be observed.
  window.__posted = [];
  const store = (() => { try { return JSON.parse(sessionStorage.getItem("entomatical-harness-state") || "null") || undefined; } catch { return undefined; } })();
  window.__state = store;
  window.acquireVsCodeApi = () => ({
    postMessage: (m) => { window.__posted.push(JSON.parse(JSON.stringify(m))); },
    setState: (s) => { window.__state = JSON.parse(JSON.stringify(s)); try { sessionStorage.setItem("entomatical-harness-state", JSON.stringify(s)); } catch { /* storage unavailable */ } },
    getState: () => window.__state,
  });
  // The host is simulated by the test: window.__host(data) delivers one message as the extension would.
  window.__host = (data) => window.dispatchEvent(new MessageEvent("message", { data }));
</script>
<script src="../media/usage.js"></script>
<script src="../media/plan-graph.js"></script>
<script src="../media/plan-presets.js"></script>
<script src="../media/plan-setup.js"></script>
<script src="../media/board.js"></script>
<script>
  if (!location.search) {
    window.__host({ tasks: [], live: [], own: [], accounts: ["acct"] });
    for (const [label, value] of [["Model for new task", "opus"], ["Effort for new task", "high"]]) {
      const box = document.querySelector(`select[aria-label="${label}"]`); box.value = value; box.dispatchEvent(new Event("change"));
    }
  }
  window.__ready = true;
</script>
</body></html>
