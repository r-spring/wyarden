<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Entomatical helper tab harness</title>
<link rel="stylesheet" href="../media/board.css"></head>
<body class="helper-tab">
<script>
  // Stand-in for the VS Code webview API: the real media/helper-tab.js runs unchanged on top of it (test/compile-webview-cdp.js).
  window.__posted = [];
  window.acquireVsCodeApi = () => ({ postMessage: (m) => { window.__posted.push(JSON.parse(JSON.stringify(m))); } });
  window.__host = (data) => window.dispatchEvent(new MessageEvent("message", { data }));
</script>
<script src="../media/usage.js"></script>
<script src="../media/helper-tab.js"></script>
<script>window.__ready = true;</script>
</body></html>
